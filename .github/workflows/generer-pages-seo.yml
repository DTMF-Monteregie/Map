# Régénération automatique des pages du site à partir de data.json
# ==================================================================
# Mis en place le 19 août 2026.
#
# CE QUE ÇA FAIT
#   Dès que data.json est modifié sur GitHub (par le crayon « modifier » du site web, par un
#   téléversement, ou par n'importe quel autre moyen), ce robot :
#     1. régénère les 61 pages de cliniques, les 6 pages de RLS, le répertoire et sitemap.xml ;
#     2. vérifie qu'aucune donnée privée n'a fui dans les pages produites ;
#     3. publie le résultat directement sur le site.
#   Il n'y a donc plus rien à faire à la main après avoir modifié data.json : le site se met à
#   jour tout seul en une à deux minutes.
#
# CE QUE ÇA NE TOUCHE JAMAIS
#   data.json lui-même (le robot le lit, il ne l'écrit jamais), index.html, sw.js, ptem/, amp/.
#
# SI ÇA NE DÉMARRE PAS
#   Il faut autoriser une seule fois les robots à écrire dans le dépôt :
#   Settings → Actions → General → Workflow permissions → « Read and write permissions » → Save.
#
# POUR LE LANCER À LA MAIN
#   Onglet « Actions » du dépôt → « Régénérer les pages du site » → bouton « Run workflow ».
#   (Utile après avoir modifié le générateur, ou pour forcer une reconstruction.)

name: Régénérer les pages du site

on:
  push:
    paths:
      # Volontairement PAS « scripts/** » : le robot peut avoir à écrire scripts/slugs.json quand
      # une nouvelle clinique apparaît, et ce commit-là relancerait le robot en boucle sans fin.
      # On ne réagit donc qu'aux deux fichiers qui sont réellement des entrées.
      - 'data.json'
      - 'scripts/generer-pages-seo.js'
  workflow_dispatch:

# Autorise ce robot à publier ses modifications dans le dépôt.
permissions:
  contents: write

# Si deux modifications de data.json arrivent coup sur coup, on ne garde que la dernière
# régénération plutôt que d'en lancer deux en parallèle qui se marcheraient dessus.
concurrency:
  group: generation-pages-seo
  cancel-in-progress: true

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Régénérer les pages et le sitemap
        run: node scripts/generer-pages-seo.js

      - name: Vérifier qu'aucune donnée privée n'a fui
        # Filet de sécurité : ce robot publie sans qu'un humain relise. Si le générateur venait à
        # être modifié de travers, on préfère que la publication ÉCHOUE plutôt qu'elle mette en
        # ligne des courriels nominatifs ou des notes personnelles.
        run: |
          set -e
          echo "Recherche d'adresses courriel dans les pages générées..."
          if grep -rIEl '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' cliniques/ rls/ ; then
            echo "::error::Une adresse courriel apparaît dans les pages générées. Publication annulée."
            exit 1
          fi
          echo "Recherche de champs internes (notes, posApprox, alias)..."
          if grep -rIl -e '"notes"' -e 'posApprox' -e '"alias"' cliniques/ rls/ ; then
            echo "::error::Un champ interne apparaît dans les pages générées. Publication annulée."
            exit 1
          fi
          echo "Vérification que data.json n'a pas été modifié..."
          if ! git diff --quiet -- data.json ; then
            echo "::error::Le générateur a modifié data.json, ce qu'il ne doit jamais faire. Publication annulée."
            exit 1
          fi
          echo "Vérification du sitemap..."
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"
          echo "Toutes les vérifications sont passées."

      - name: Publier si quelque chose a changé
        run: |
          set -e
          git config user.name  "Robot Trouve ta clinique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cliniques rls sitemap.xml scripts/slugs.json
          if git diff --cached --quiet ; then
            echo "Les pages étaient déjà à jour : rien à publier."
            exit 0
          fi
          git commit -m "Régénération des pages du site depuis data.json [automatique]"
          git push
          echo "Pages publiées."
